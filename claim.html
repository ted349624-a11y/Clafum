:root{
  --bg:#141414;
  --coral:#e17a56;
  --glow:#ffb08a;
  --ink:#ece8e2;
  --mute:#8d8983;
  --line:#3a3a3a;
  --bad:#ff7a66;
}

*{box-sizing:border-box;margin:0;padding:0}
button,input{font-family:inherit;border-radius:0}
html{-webkit-text-size-adjust:100%}

body{
  background:var(--bg);color:var(--ink);
  font-family:'DM Mono',ui-monospace,Menlo,monospace;
  font-size:14px;line-height:1.65;
  min-height:100dvh;overflow-x:hidden;
}

.wrap{max-width:460px;margin:0 auto;padding:16px 18px calc(32px + env(safe-area-inset-bottom))}

.top{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:'Doto',monospace;font-weight:900;font-size:19px;letter-spacing:.05em;
}
.top .tag{color:var(--mute)}
.top .tag b{color:var(--coral)}

/* ---------- scene ---------- */
.scene{position:relative;height:clamp(300px,42dvh,330px);margin:4px -18px 0;overflow:hidden}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- copy ---------- */
.kicker{
  font-family:'Doto',monospace;font-weight:700;font-size:14px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);margin:14px 0 10px;
}
.say{
  font-family:'Doto',monospace;font-weight:900;
  font-size:clamp(30px,9vw,40px);line-height:1.02;margin-bottom:18px;
}
.gift{margin:0 0 20px;padding:16px 18px 14px;border:3px dotted var(--coral)}
.gl{font-family:'Doto',monospace;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.gv{font-family:'Doto',monospace;font-weight:900;font-size:clamp(52px,17vw,72px);line-height:1.05;color:var(--coral);margin:2px 0 4px;letter-spacing:.01em}
.gs{color:var(--mute);font-size:13px;line-height:1.5}
.gv{font-size:clamp(46px,14.5vw,64px) !important}
.gsym{font-family:'Doto',monospace;font-weight:900;font-size:clamp(22px,7vw,30px);color:var(--ink);line-height:1.1;margin:0 0 8px}
.token{margin:6px 0 4px;color:var(--mute);font-size:13px}
.token .tk{font-family:'Doto',monospace;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.token .tn{color:var(--ink);font-size:14px;margin-top:2px}
.mint{display:flex;gap:10px;align-items:center;margin-top:6px}
.mint code{font-family:inherit;font-size:12px;word-break:break-all;color:var(--ink);flex:1}
.mint button{font-family:'Doto',monospace;font-weight:900;font-size:14px;color:var(--coral);background:none;border:3px dotted var(--coral);padding:2px 10px;cursor:pointer}
.mint button:hover{background:var(--coral);color:var(--bg);border-style:solid}
.lede p{color:#bdb8b1;margin-bottom:14px}
.lede p b{color:var(--ink);font-weight:500}
.lede p.lead{color:var(--ink)}

/* ---------- lock row ---------- */
.lockrow{
  display:flex;gap:16px;align-items:center;
  margin:20px 0 6px;padding:16px 0;
  border-top:3px dotted var(--line);border-bottom:3px dotted var(--line);
}
.lockrow svg{flex:none;width:36px;height:40px}
.lk{font-family:'Doto',monospace;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ld{color:var(--ink);font-size:14px;margin-top:2px}
.cd{font-family:'Doto',monospace;font-weight:900;font-size:clamp(22px,6.6vw,28px);color:var(--coral);margin-top:4px;letter-spacing:.03em}

/* ---------- reserved ---------- */
.reserved{
  margin:18px 0 4px;padding:16px 18px;
  border:3px dotted var(--coral);
}
.rv{font-family:'Doto',monospace;font-weight:900;font-size:24px;color:var(--coral);line-height:1.1}
.rw{margin-top:6px;color:var(--ink)}
.rw span{color:var(--mute)}
.rn{margin-top:8px;color:var(--mute);font-size:13px}
.rn a{color:var(--coral)}

/* ---------- steps ---------- */
.steps{list-style:none;margin-top:6px}
.step{
  display:grid;grid-template-columns:42px 1fr auto;gap:4px 14px;align-items:start;
  padding:18px 0;border-bottom:3px dotted var(--line);
}
.num{
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;
  border:3px dotted var(--mute);color:var(--mute);
  font-family:'Doto',monospace;font-weight:900;font-size:18px;
}
.t{font-family:'Doto',monospace;font-weight:900;font-size:clamp(19px,5.6vw,23px);line-height:1.1;margin-top:3px}
.s{color:var(--mute);font-size:13px;margin-top:5px;line-height:1.5}
.act{padding-top:2px}

.step.active .num{border-color:var(--coral);color:var(--coral)}
.step.done .num{background:var(--coral);border:3px solid var(--coral);color:var(--bg)}
.step.done .t{color:var(--mute)}
.step.locked .t,.step.locked .s{opacity:.4}
.step.locked .num{opacity:.4}

.ok{font-family:'Doto',monospace;font-weight:900;font-size:22px;color:var(--coral)}

.btn{
  font-family:'Doto',monospace;font-weight:900;font-size:17px;letter-spacing:.03em;
  color:var(--coral);background:none;
  border:3px dotted var(--coral);padding:6px 16px;cursor:pointer;
  transition:background .12s,color .12s;white-space:nowrap;
  touch-action:manipulation;
}
.btn:hover:not(:disabled),.btn:focus-visible{background:var(--coral);color:var(--bg);border-style:solid;outline:none}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn:disabled{color:var(--mute);border-color:var(--line);cursor:default;opacity:.55}

.inline{grid-column:2 / 4;margin-top:6px}

.err{min-height:20px;margin-top:6px;font-size:13px;color:var(--bad)}
.again{
  grid-column:2 / 4;justify-self:start;
  background:none;border:none;color:var(--mute);font-size:13px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 0;
}
.again:hover{color:var(--ink)}

.more{list-style:none;padding:16px 0 4px;text-align:center;color:var(--mute);font-size:13px}
.step.enter{animation:rise .38s ease-out}

@media (prefers-reduced-motion:reduce){.step.enter{animation:none}}

.foot{margin-top:30px;text-align:center;font-size:12px;color:var(--mute);line-height:1.8}
.foot a{color:var(--ink);text-underline-offset:3px}

.honey{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function b58bytes(s){
  let n = 0n;
  for (const ch of s){ const i = B58.indexOf(ch); if (i < 0) return -1; n = n * 58n + BigInt(i); }
  let lead = 0; for (const ch of s){ if (ch === "1") lead++; else break; }
  let hex = n.toString(16); if (hex.length % 2) hex = "0" + hex;
  return (n === 0n ? 0 : hex.length / 2) + lead;
}
const SOL = { test: v => B58RE.test(v) && b58bytes(v) === 32 };

function postViaIframe(fields){

    document.body.append(fr_, fm);

    fm.submit();
  });
}

function holesFor(mood, t){
  const blink = (t % 3400) < 140;
  let eyes, mouth;
  if (mood === "sleep")       { eyes = [...LINE_L, ...LINE_R]; mouth = M_FLAT; }
  else if (mood === "sleepy") { eyes = [...EYE_L, ...LINE_R];  mouth = M_FLAT; }
  else if (mood === "happy")  { eyes = EYE_HAPPY;              mouth = M_BIG; }
  else if (mood === "ready")  { eyes = blink ? [...LINE_L, ...LINE_R] : [...EYE_L, ...EYE_R]; mouth = M_O; }
  else                        { eyes = blink ? [...LINE_L, ...LINE_R] : [...EYE_L, ...EYE_R]; mouth = M_SMILE; }
  return new Set([...eyes, ...mouth].map(([c, r]) => c + "," + r));
}

function spriteCanvas(cl, tw, mirror, color){
  const s = tw / cl.w, c = document.createElement("canvas");
  c.width = Math.ceil(tw * dpr); c.height = Math.ceil(cl.h * s * dpr);
  const x = c.getContext("2d"); x.fillStyle = color;
  for (const [dx, dy, b] of cl.d){
    x.beginPath(); x.arc((mirror ? cl.w - dx : dx) * s * dpr, dy * s * dpr, Math.max(.8, (b ? 3.3 : 2.2) * s) * dpr, 0, 6.2832); x.fill();
  }
  return c;
}
const fr = (x, y, w, h) => {
  const X_ = Math.round(x * dpr) / dpr, Y_ = Math.round(y * dpr) / dpr;
  ctx.fillRect(X_, Y_, Math.round(w * dpr) / dpr || 1 / dpr, Math.round(h * dpr) / dpr || 1 / dpr);
};

function layout(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const sc = $("scene");
  W = sc.clientWidth; H = sc.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  cs = Math.max(6, Math.min(8, Math.floor(H * .42 / 16 / 2) * 2));
  ox = Math.round((W - 16 * cs) / 2);
  baseOy = Math.round(H - 16 * cs - cs * 1.8);

  const cl = CLOUDS[1];
  cloud.w = Math.min(W * .64, 270); cloud.s = cloud.w / cl.w; cloud.h = cl.h * cloud.s;
  cloud.x = (W - cloud.w) / 2; cloud.y = 10;

  const defs = [
    { cl:0, tw:.46, y:.04, sp:7,  m:false }, { cl:2, tw:.36, y:.30, sp:5, m:true },
    { cl:1, tw:.40, y:.52, sp:9,  m:false }, { cl:0, tw:.30, y:.70, sp:6, m:true },
  ];
  bgClouds = defs.map((d, i) => {
    const w = d.tw * W, c = CLOUDS[d.cl];
    return { w, h: c.h * w / c.w, y: d.y * H, sp: d.sp, x: (i * .27 * W) % W - w * .3, img: spriteCanvas(c, w, d.m, COLORS.dim) };
  });
  if (REDUCED) frame(0);
}

function creaturePos(t){
  const mood = moodNow();
  let bob = 0, up = false;
  if (!REDUCED){
    if (t < hopUntil){
      const u = 1 - (hopUntil - t) / 620;
      bob = -Math.sin(Math.PI * u) * cs * 3; up = true;
    } else if (mood === "happy"){ bob = -Math.abs(Math.sin(t / 240)) * cs * 2; up = Math.floor(t / 240) % 2 === 0; }
    else if (mood === "sleep" || mood === "sleepy") bob = Math.sin(t / 650) * cs * .3;
    else bob = Math.sin(t / 420) * cs * .25;
    bob = Math.round(bob / (cs / 2)) * (cs / 2);
  }
  return { oy: baseOy + bob, up, mood };
}

function drawCreature(t){
  const { oy, up, mood } = creaturePos(t);
  const holes = holesFor(mood, t);
  const glowing = mood === "ready" || mood === "happy";
  const tips = (REDUCED ? 0 : Math.floor(t / (mood === "happy" ? 200 : mood === "sleep" ? 1400 : 520)) % 2) ? TIPS_B : TIPS_A;

  ctx.fillStyle = COLORS.dim;
  const gy = baseOy + 16 * cs + cs * .6, step = cs * .9;
  for (let r = -1; r <= 1; r++){
    const half = (r === 0 ? 7.2 : 5.2) * cs;
    for (let x = -half; x <= half; x += step){ ctx.beginPath(); ctx.arc(W / 2 + x + (r ? step / 2 : 0), gy + r * step * .6, cs * .13, 0, 6.2832); ctx.fill(); }
  }
  const put = (cells, color) => {
    ctx.fillStyle = color;
    for (const [c, r] of cells){ if (holes.has(c + "," + r)) continue; fr(ox + c * cs, oy + r * cs, cs + .6, cs + .6); }
  };
  put(BASE, COLORS.coral);
  put(up ? ARMS_UP : ARMS_DOWN, COLORS.coral);
  put(tips, glowing && (Math.floor(t / 220) % 2) ? COLORS.glow : COLORS.coral);
}

function drawShare(t){
  const bob = REDUCED ? 0 : Math.round(Math.sin(t / 900) * 3);
  const r1 = Math.max(.9, 2.2 * cloud.s), r2 = Math.max(.9, 3.3 * cloud.s);
  const full = shown > .985;
  for (let i = 0; i < DOTS.length; i++){
    const d = DOTS[i], lit = d.t <= shown;
    ctx.fillStyle = lit ? ((full && !REDUCED && (i + Math.floor(t / 180)) % 19 === 0) ? COLORS.glow : COLORS.coral) : COLORS.dot;
    ctx.beginPath(); ctx.arc(cloud.x + d.x * cloud.s, cloud.y + bob + d.y * cloud.s, d.b ? r2 : r1, 0, 6.2832); ctx.fill();
  }
  if (S.wallet && full){                                   // the lock closes once the share is reserved
    const lc = Math.max(3, Math.round(cloud.s * 9));
    const lx = Math.round(cloud.x + cloud.w / 2 - 4.5 * lc), ly = Math.round(cloud.y + bob + cloud.h / 2 - 5 * lc);
    ctx.fillStyle = "#141414";
    LOCK.forEach((row, y) => { for (let x = 0; x < 9; x++) if (row[x] === "#") fr(lx + x * lc, ly + y * lc, lc + .5, lc + .5); });
  }
}

const Z_GLYPH = [[0,0],[1,0],[2,0],[3,0],[4,0],[3,1],[2,2],[1,3],[0,4],[1,4],[2,4],[3,4],[4,4]];
function drawZs(t){
  const mood = moodNow();
  if (!REDUCED && (mood === "sleep" || mood === "sleepy") && t > nextZ){ zs.push({ x: ox + 13 * cs, y: baseOy + 3 * cs, t0: t }); nextZ = t + 1300; }
  for (let i = zs.length - 1; i >= 0; i--){
    const z = zs[i], age = (t - z.t0) / 2800;
    if (age >= 1){ zs.splice(i, 1); continue; }
    const s = Math.max(2, Math.round(cs * (.13 + age * .1))), x = z.x + age * cs * 3 + Math.sin(age * 6) * cs * .4, y = z.y - age * cs * 4.5;

    for (const [px, py] of Z_GLYPH) fr(x + px * s, y + py * s, s, s);
    ctx.globalAlpha = 1;
  }
}

}
function drawSparks(t){
  for (let i = sparks.length - 1; i >= 0; i--){
    const s = sparks[i], age = (t - s.t0) / 800;
    if (age >= 1){ sparks.splice(i, 1); continue; }
    if (age < 0) continue;
    const k = 3, a = Math.sin(age * Math.PI);
    ctx.globalAlpha = a; ctx.fillStyle = i % 2 ? COLORS.glow : COLORS.ink;
    fr(s.x, s.y, k, k); fr(s.x - k, s.y, k, k); fr(s.x + k, s.y, k, k); fr(s.x, s.y - k, k, k); fr(s.x, s.y + k, k, k);
    ctx.globalAlpha = 1;
  }
}

function frame(now){
  const dt = Math.min(50, now - last) / 1000; last = now;
  const aim = progress();
  shown = REDUCED ? aim : shown + (aim - shown) * Math.min(1, dt * 2.6);
  if (Math.abs(aim - shown) < .002) shown = aim;

  ctx.clearRect(0, 0, W, H);
  ctx.globalAlpha = .5;
  for (const c of bgClouds){
    if (!REDUCED){ c.x += c.sp * dt; if (c.x > W) c.x = -c.w; }
    ctx.drawImage(c.img, c.x, c.y, c.w, c.h);
  }
  ctx.globalAlpha = 1;
  drawShare(now);
  drawCreature(now);
  drawZs(now);
  drawSparks(now);
  if (!REDUCED) requestAnimationFrame(frame);
}

function bump(){ hopUntil = performance.now() + 620; sparkle(16); }

/* ---------------------------------------------------------
   the page
   --------------------------------------------------------- */
const fmtDate = d => d.toLocaleString("en-US", { month:"long", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit", timeZoneName:"short" });

function paintLede(){
  const a = CONFIG.airdrop, amt = a.amount.toLocaleString("en-US");
  const dateLine = hasDate
    ? 'On <b>' + esc(fmtDate(new Date(REVEAL))) + '</b> the list closes and the airdrop is sent.'
    : 'The date the list closes and the airdrop is sent will be announced on <b>@' + esc(X) + '</b>.';
  $("lede").innerHTML =
    '<p class="lead">Every wallet that finishes the steps below gets <b>' + amt + ' $' + esc(a.symbol) + '</b>.</p>' +
    '<p>One airdrop per person. Duplicate and fake accounts are removed before anything is sent.</p>' +
    '<p>' + dateLine + '</p>' +
    '<p>Until then your airdrop is reserved. The wait lets us check accounts and line up the transfer.</p>';
  $("ld").textContent = hasDate ? fmtDate(new Date(REVEAL)) : "announced on @" + X;

  const mint = (CONFIG.mint || "").trim();
  $("token").innerHTML = '<div class="tk">token</div><div class="tn">$' + esc(a.symbol) + ' · Solana</div>' +
    (mint
      ? '<div class="mint"><code>' + esc(mint) + '</code><button type="button" id="cpm">copy</button></div>'
      : '<div>token address will be announced on @' + esc(X) + '</div>');
  const cp = $("cpm");
  if (cp) cp.onclick = async () => {
    try { await navigator.clipboard.writeText(mint); cp.textContent = "copied"; } catch(e){ cp.textContent = "select it"; }
    setTimeout(() => cp.textContent = "copy", 1600);
  };
}

const pad = n => String(n).padStart(2, "0");
function tick(){
  if (!hasDate){ $("cd").textContent = ""; return; }
  const ms = REVEAL - Date.now();
  if (ms <= 0){ $("cd").textContent = "snapshot time reached"; return; }
  const s = Math.floor(ms / 1000);
  $("cd").textContent = pad(Math.floor(s / 86400)) + "d " + pad(Math.floor(s / 3600) % 24) + "h " + pad(Math.floor(s / 60) % 60) + "m " + pad(s % 60) + "s";
}

function paintTop(){
  const a = CONFIG.airdrop;
  $("tag").innerHTML = S.handle ? 'steps <b>' + doneCount() + '</b>/' + ROWS.length : "";
  $("reserved").innerHTML = S.wallet
    ? '<div class="reserved"><div class="rv">claim registered</div>' +
      '<div class="rw">' + a.amount.toLocaleString("en-US") + ' $' + esc(a.symbol) + ' <span>· @' + esc(S.handle) + ' · ' + esc(S.short || "") + '</span></div>' +
      '<div class="rn">The airdrop is sent to that wallet when the list closes. Keep notifications on for <a href="https://x.com/' + esc(X) + '" target="_blank" rel="noopener">@' + esc(X) + '</a>.</div></div>'
    : "";
}

let lastActive = "";
function renderSteps(){
  const cur = current();
  const animate = cur >= 0 && ROWS[cur].k !== lastActive;
  lastActive = cur >= 0 ? ROWS[cur].k : "";
  const rowsHtml = ROWS.map((r, i) => {
    const done = isDone(r.k), active = i === cur;
    if (!done && !active) return "";                          // later steps stay hidden until their turn
    const cls = done ? "done" : active ? "active" : "locked";
    const isTask = !["handle", "wallet"].includes(r.k);
    let sub = r.sub;
    if (done && r.k === "handle") sub = "@" + esc(S.handle);
    if (done && r.k === "wallet") sub = esc(S.short || "");

    let act;
    if (done) act = '<span class="ok">✓</span>';
    else if (active) act = '<button class="btn" type="button" data-go="' + r.k + '">' + (isTask && S.opened[r.k] ? "Done?" : r.btn) + '</button>';
    else act = '<button class="btn" type="button" disabled>' + r.btn + '</button>';

    let extra = "";
    if (active && r.k === "handle")
      extra = '<div class="inline"><label class="fieldw"><span class="at">@</span><input class="in" id="in" type="text" placeholder="your x handle" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="16"></label><p class="err" id="err"></p></div>';
    if (active && r.k === "wallet")
      extra = '<div class="inline"><label class="fieldw"><input class="in" id="in" type="text" placeholder="' + WALLET_LABEL + '" autocomplete="off" autocapitalize="off" spellcheck="false"></label><p class="err" id="err"></p></div>';
    if (active && isTask && S.opened[r.k])
      extra = '<button class="again" type="button" data-again="' + r.k + '">open X again ↗</button>';

    return '<li class="step ' + cls + (active && animate ? " enter" : "") + '"><span class="num">' + (done ? "✓" : i + 1) + '</span>' +
           '<div class="info"><div class="t">' + r.title + '</div><div class="s">' + sub + '</div></div>' +
           '<div class="act">' + act + '</div>' + extra + '</li>';
  }).join("");
  const left = cur >= 0 ? ROWS.length - 1 - cur : 0;
  $("steps").innerHTML = rowsHtml + (left > 0 ? '<li class="more">' + left + ' more step' + (left > 1 ? "s" : "") + ' unlock as you go</li>' : "");

  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll("[data-again]").forEach(b => b.onclick = () => window.open(taskUrl(b.dataset.again), "_blank", "noopener"));
  const inp = $("in");
  if (inp) inp.onkeydown = e => { if (e.key === "Enter") go(current() >= 0 ? ROWS[current()].k : ""); };
  if (inp) inp.oninput = () => { const er = $("err"); if (er) er.textContent = ""; };
}

function paintAll(){
  paintGift();
  paintTop();
  renderSteps();
  if (REDUCED) frame(0);
}

async function go(k){
  if (k === "handle"){
    const v = $("in").value.trim();
    if (!HAND.test(v)){ $("err").textContent = "that doesn't look like an x handle."; return; }
    S.handle = v.replace(/^@/, ""); save(); bump(); paintAll(); return;
  }
  if (k === "wallet"){
    if ($("website").value) return;
    const v = $("in").value.trim();
    if (!walletOk(v)){ $("err").textContent = CONFIG.chain === "sol" ? "that's not a solana address." : "that's not a wallet address."; return; }
    const btn = document.querySelector('[data-go="wallet"]'); btn.disabled = true; btn.textContent = "…";
    await send({ [CONFIG.form.handle]: S.handle, [CONFIG.form.wallet]: v });
    S.wallet = true; S.short = v.slice(0, 6) + "…" + v.slice(-4); save(); bump(); sparkle(30); paintAll(); return;
  }
  if (!S.opened[k]){ window.open(taskUrl(k), "_blank", "noopener"); S.opened[k] = true; save(); renderSteps(); return; }
  S[k] = true; save(); bump(); paintAll();
}

/* ---------------------------------------------------------
   go
   --------------------------------------------------------- */
paintLede();
layout();
shown = progress();
paintAll();
tick(); setInterval(tick, 1000);
addEventListener("resize", layout);
if (!REDUCED) requestAnimationFrame(t => { last = t; frame(t); }); else frame(0);
</script>
</body>
